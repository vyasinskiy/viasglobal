services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: viasrent-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      accruals-network:
        aliases:
          - rabbitmq
          - viasrent-rabbitmq
          - accruals-rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: viasglobal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viasrent_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Единый инстанс PostgreSQL обслуживает все сервисы на стандартном 5432 и совместимом 5433
      - '5432:5432'
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      accruals-network:
        aliases:
          - db
          - postgres
          - accruals-postgres
          - viasglobal-postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-viasrent_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  visual-browser:
    image: viasrent-visual-browser:latest
    build:
      context: ./visual-browser
      dockerfile: Dockerfile
    container_name: viasrent-visual-browser
    profiles:
      - manual
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - CUSTOM_USER=${ADMIN_USER:-admin}
      - PASSWORD=${ADMIN_PASSWORD:-viasglobal}
      - KEYBOARD_LAYOUT=us,ru
      - XKB_DEFAULT_LAYOUT=us,ru
      - XKB_DEFAULT_OPTIONS=grp:ctrl_space_toggle,grp:ctrl_shift_toggle,grp:alt_shift_toggle
      - LC_ALL=ru_RU.UTF-8
      - LANG=ru_RU.UTF-8
      - CHROME_CLI=https://xn--80aaaf3bi1ahsd.xn--80asehdb/login
    volumes:
      - ${WATCHER_PATH:-../apps/watcher}/data/browser-profile:/config
    ports:
      - '3002:3000'
    networks:
      accruals-network:
        aliases:
          - visual-browser
          - viasrent-visual-browser
          - accruals-visual-browser
    restart: unless-stopped

  watcher:
    image: viasrent-watcher:latest
    build:
      context: ${WATCHER_PATH:-../apps/watcher}
      dockerfile: Dockerfile
    container_name: viasrent-watcher
    restart: unless-stopped
    ports:
      - '4500:4500'
    env_file:
      - ${WATCHER_PATH:-../apps/watcher}/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      ACCOUNTANT_API_URL: http://accountant:3005
      BROWSER_WS_ENDPOINT: ""
      BROWSER_PROFILE_PATH: "/app/data/browser-profile/.config/chromium"
      BROWSER_PUBLIC_URL: ${BROWSER_PUBLIC_URL:-https://browser.viasglobal.es}
      VISUAL_BROWSER_CONTAINER: viasrent-visual-browser
      IS_DOCKER: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/viasrent_db?schema=watcher
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/viasrent_db?schema=watcher
    depends_on:
      rabbitmq:
        condition: service_started
      accountant:
        condition: service_started
    volumes:
      - ${WATCHER_PATH:-../apps/watcher}/data:/app/data
      - ./logs/watcher:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      accruals-network:
        aliases:
          - watcher
          - viasrent-watcher
          - accruals-watcher

  accountant:
    image: viasrent-accountant:latest
    build:
      context: ${ACCOUNTANT_PATH:-../apps/accountant}
      dockerfile: Dockerfile
    container_name: viasrent-accountant
    restart: unless-stopped
    ports:
      - '3005:3005'
    env_file:
      - ${ACCOUNTANT_PATH:-../apps/accountant}/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/viasrent_db?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/viasrent_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      SUPER_ADMIN_TELEGRAM_ID: ${SUPER_ADMIN_TELEGRAM_ID}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - ${ACCOUNTANT_PATH:-../apps/accountant}/data:/app/data
      - ./logs/accountant:/app/logs
    networks:
      accruals-network:
        aliases:
          - accountant
          - viasrent-accountant
          - accruals-accountant

  admin-ui:
    image: viasrent-admin-ui:latest
    build:
      context: ${ADMIN_UI_PATH:-../apps/admin-ui}
      dockerfile: Dockerfile
    container_name: viasrent-admin-ui
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ${ADMIN_UI_PATH:-../apps/admin-ui}/.env
      - ${TELEGRAM_BOT_PATH:-../apps/telegram-bot}/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      PORT: 3000
      ACCOUNTANT_API_URL: http://accountant:3005
      WATCHER_API_URL: http://watcher:4500
    depends_on:
      rabbitmq:
        condition: service_started
      accountant:
        condition: service_started
    networks:
      accruals-network:
        aliases:
          - admin-ui
          - viasrent-admin-ui
          - accruals-admin-ui

  telegram-bot:
    image: viasrent-telegram-bot:latest
    build:
      context: ${TELEGRAM_BOT_PATH:-../apps/telegram-bot}
      dockerfile: Dockerfile
    container_name: viasrent-telegram-bot
    restart: unless-stopped
    env_file:
      - ${TELEGRAM_BOT_PATH:-../apps/telegram-bot}/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      TELEGRAM_BOT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/viasrent_db?schema=telegram_bot
      SUPER_ADMIN_TELEGRAM_ID: ${SUPER_ADMIN_TELEGRAM_ID}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_started
      accountant:
        condition: service_started
    volumes:
      - ./logs/telegram-bot:/app/logs
    networks:
      accruals-network:
        aliases:
          - telegram-bot
          - viasrent-telegram-bot
          - accruals-telegram-bot

networks:
  accruals-network:
    name: infra_accruals-network
    driver: bridge


volumes:
  postgres_data:
