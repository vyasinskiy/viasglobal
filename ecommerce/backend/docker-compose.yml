version: '3.8'
services:
  backend:
    build: .
    container_name: viasglobal-backend
    restart: always
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      # Подключение к единому инстансу PostgreSQL viasglobal-postgres в общей сети
      DATABASE_URL: "postgresql://viasuser:viaspassword@viasglobal-postgres:5432/viasglobal_db?schema=public"
    networks:
      - default
      - accruals-network

  ecommerce-admin:
    image: ecommerce-admin:latest
    build:
      context: ../crm
      dockerfile: Dockerfile
    container_name: ecommerce-admin
    restart: always
    ports:
      - "3006:3000"
    env_file:
      - ../crm/.env
    environment:
      PORT: 3000
      BACKEND_API_URL: "http://backend:3000"
    depends_on:
      - backend
    networks:
      - default
      - accruals-network

networks:
  accruals-network:
    external: true
    name: infra_accruals-network

