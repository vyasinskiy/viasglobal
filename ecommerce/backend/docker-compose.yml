version: '3.8'
services:
  db:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: always
    environment:
      POSTGRES_USER: viasuser
      POSTGRES_PASSWORD: viaspassword
      POSTGRES_DB: viasglobal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://viasuser:viaspassword@db:5432/viasglobal_db?schema=public"
    depends_on:
      - db

  ecommerce-admin:
    image: ecommerce-admin:latest
    build:
      context: ../crm
      dockerfile: Dockerfile
    container_name: ecommerce-admin
    restart: always
    ports:
      - "3006:3000"
    env_file:
      - ../crm/.env
    environment:
      PORT: 3000
      BACKEND_API_URL: "http://backend:3000"
    depends_on:
      - backend
    networks:
      - default
      - accruals-network

networks:
  accruals-network:
    external: true
    name: infra_accruals-network

volumes:
  pgdata:
