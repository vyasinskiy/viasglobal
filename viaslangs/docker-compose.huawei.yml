# ==============================================================================
# Docker Compose конфигурация для сервиса Viaslangs на сервере Huawei
# ==============================================================================
name: viaslangs

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: viaslangs-web
    restart: unless-stopped
    environment:
      # Подключение к PostgreSQL внутри общей Docker-сети infra_accruals-network
      DATABASE_URL: postgresql://postgres:postgres@viasglobal-postgres:5432/viaslangs_db
      PORT: 3000
      NODE_ENV: production
      VIASLANGS_APP_SECRET: e4201cba41a7cddd45d1a0e6ffff3b30d610c98a2d4f50c4d24f6d4b9513916c
      VIASLANGS_APP_PASSWORD: viasglobal
    ports:
      # Проброс порта на хост для доступа через Tailscale и Cloudflare Tunnel
      - "3007:3000"
    networks:
      - infra_accruals-network

networks:
  infra_accruals-network:
    external: true
