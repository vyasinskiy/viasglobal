name: viaslangs

services:
  db:
    image: postgres:16-alpine
    container_name: viaslangs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: viasuser
      POSTGRES_PASSWORD: vias-langs-password
      POSTGRES_DB: viaslangs_db
    volumes:
      - viaslangs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viasuser -d viaslangs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      args:
        REACT_APP_BACKEND_URL: http://100.92.50.18:4000
    container_name: viaslangs-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://viasuser:vias-langs-password@db:5432/viaslangs_db
      BACKEND_PORT: 4000
    ports:
      - "4000:4000"
    command: >
      sh -c "cd server && npx prisma db push && cd .. && node server/index.js"

volumes:
  viaslangs_pgdata:
