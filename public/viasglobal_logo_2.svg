<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 50 480 100" width="100%" height="100%" id="svg-logo-2">
  <defs>
    <linearGradient id="amazonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&amp;display=swap');
      .logo-text {
        font-family: 'Outfit', sans-serif;
        fill: #232F3E;
        transition: fill 0.3s ease;
      }
      .logo-brand {
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -1px;
      }
      .logo-suffix {
        font-weight: 300;
        fill: #FF9900;
      }
      .logo-tagline {
        font-weight: 400;
        font-size: 14px;
        fill: #94A3B8;
        letter-spacing: 7px;
      }
    </style>
  </defs>
  <g transform="translate(40, 0)">
    <circle cx="100" cy="100" r="42" fill="none" stroke="#232F3E" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M 60,100 C 60,75 80,75 100,100 C 120,125 140,125 140,100 C 140,75 120,75 100,100 C 80,125 60,125 60,100 Z" fill="none" stroke="url(#amazonOrange)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="100" r="3" fill="#232F3E"/>
    <circle cx="140" cy="100" r="3" fill="#232F3E"/>
    <circle cx="100" cy="100" r="3" fill="#232F3E"/>
  </g>
  <text x="220" y="100" dominant-baseline="central" class="logo-text logo-brand">vias<tspan class="logo-suffix">global</tspan></text>
</svg>